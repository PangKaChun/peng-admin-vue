<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>
    <%= webpackConfig.name %>
  </title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      background-color: #24292f;
    }

    #loader-wrapper .load {
      position: relative;
      width: 600px;
      height: 36px;
      user-select: none;
    }

    #loader-wrapper .load div {
      position: absolute;
      width: 20px;
      height: 36px;
      font-size: 30px;
      opacity: 0;
      transform: rotate(180deg);
      animation: move 2s linear infinite;
      color: #FFF;
    }

    #loader-wrapper .load div:nth-child(2) {
      animation-delay: .2s;
    }

    #loader-wrapper .load div:nth-child(3) {
      animation-delay: .4s;
    }

    #loader-wrapper .load div:nth-child(4) {
      animation-delay: .6s;
    }

    #loader-wrapper .load div:nth-child(5) {
      animation-delay: .8s;
    }

    #loader-wrapper .load div:nth-child(6) {
      animation-delay: 1s;
    }

    #loader-wrapper .load div:nth-child(7) {
      animation-delay: 1.2s;
    }

    @keyframes move {
      0% {
        left: 0;
        opacity: 0;
      }

      35% {
        left: 40%;
        transform: rotate(odeg);
        opacity: 1;
      }

      65% {
        left: 60%;
        transform: rotate(odeg);
        opacity: 1;
      }

      100% {
        left: 100%;
        transform: rotate(-180deg);
        opacity: 0;
      }
    }

    .no-js #loader-wrapper {
      display: none;
    }

    .no-js h1 {
      color: #222222;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div class="load">
        <div>G</div>
        <div>N</div>
        <div>I</div>
        <div>D</div>
        <div>A</div>
        <div>O</div>
        <div>L</div>
      </div>
    </div>
  </div>
</body>

</html>
